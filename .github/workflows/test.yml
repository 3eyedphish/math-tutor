# Runs the tests and a build on every pull request, so a broken change shows a red X
# before it is merged. Deploying is done by Cloudflare Workers Builds when main changes.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
